name: One-time production panel sync smoke test

on:
  push:
    branches: [main]
    paths: [.github/workflows/prod-panel-smoke.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production panel API without credentials
        shell: bash
        run: |
          set -euo pipefail
          base="https://abessserveur.pagnol.xyz"
          curl --fail --silent --show-error --max-time 15 "$base/api/v1/ping" | tee /tmp/ping.json
          grep -Eq '"ok"[[:space:]]*:[[:space:]]*true|pong|success' /tmp/ping.json || {
            echo "Unexpected ping response" >&2
            cat /tmp/ping.json >&2
            exit 1
          }

          for path in             /api/v1/auth/me             /api/v1/auth/security             /api/v1/admin/ssh             /api/v1/admin/resellers             /api/v1/admin/transactions             /api/v1/admin/operations             /api/v1/admin/nodes             /api/v1/admin/operators
          do
            code="$(curl --silent --output /tmp/body --write-out '%{http_code}' --max-time 15 "$base$path")"
            case "$code" in
              401|403) ;;
              *) echo "$path returned unexpected HTTP $code" >&2; cat /tmp/body >&2; exit 1;;
            esac
          done

          code="$(curl --silent --output /tmp/login --write-out '%{http_code}' --max-time 15             -H 'Content-Type: application/json'             -d '{"email":"sync-smoke-invalid@example.invalid","password":"invalid"}'             "$base/api/v1/auth/login")"
          case "$code" in
            400|401|403|429) ;;
            *) echo "Login route returned unexpected HTTP $code" >&2; cat /tmp/login >&2; exit 1;;
          esac

          echo "PRODUCTION_PANEL_SMOKE=SUCCESS"
