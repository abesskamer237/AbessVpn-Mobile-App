name: Verify ABESS Mobile

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: abess-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and bundle Android/iOS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Expo dependency check
        run: npx expo install --check
      - name: Expo doctor
        run: npx expo-doctor
      - name: TypeScript
        run: npm run typecheck
      - name: Bundle Android
        env:
          EXPO_PUBLIC_API_BASE_URL: https://example.invalid
        run: npm run export:android
      - name: Bundle iOS
        env:
          EXPO_PUBLIC_API_BASE_URL: https://example.invalid
        run: npm run export:ios

  android-native:
    name: Optimized Android release build
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        env:
          EXPO_PUBLIC_API_BASE_URL: https://example.invalid
        run: npx expo prebuild --clean --platform android --no-install
      - name: Build optimized ARM64 release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Prepare distributable APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/ABESS-VPN-Control-v0.3.1-ARM64.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ABESS-VPN-Control-v0.3.1-ARM64
          path: release/ABESS-VPN-Control-v0.3.1-ARM64.apk
          if-no-files-found: error
          retention-days: 30
